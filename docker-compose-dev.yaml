name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
      - EXPECTED_AGENCIES=5
    volumes:
      - ./server/config.ini:/config.ini
    networks:
      - testing_net

  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=1
      - CSV_FILEPATH=/.data/agency-1.csv
      - CLI_QUERY_SLEEPMILLIS=500
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-1.csv:/.data/agency-1.csv
    networks:
      - testing_net
    depends_on:
      - server

networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
